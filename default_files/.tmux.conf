# prefix rebind
unbind C-Space
set -g prefix C-space
bind C-Space send-prefix

# enable mouse control
set -g mouse on
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "xclip -in -selection clipboard"
setw -g mode-keys vi

# reload config file
bind r display -d 1000 "Reloading config..." \; source-file ~/.tmux.conf \; display -d 1000 "Config reloaded!"

# history limit
set-option -g history-limit 5000

# session
bind Escape detach-client
unbind d

# windows
bind Space new-window -c "#{pane_current_path}"

# panes
bind | split-window -h -c "#{pane_current_path}"
bind '\' split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind j choose-window 'join-pane -h -s "%%"'
bind J choose-window 'join-pane -s "%%"'
bind x kill-pane
bind X kill-window
bind b break-pane
bind S set-option synchronize-panes

# Claude
bind c split-window -v -c "#{pane_current_path}" "claude"

# Pane navigation - Ctrl+arrows (no prefix)
bind -n C-Left select-pane -L
bind -n C-Right select-pane -R
bind -n C-Up select-pane -U
bind -n C-Down select-pane -D

# Pane resizing - Shift+arrows (no prefix): horizontal 10, vertical 20
bind -n S-Left resize-pane -L 10
bind -n S-Right resize-pane -R 5
bind -n S-Up resize-pane -U 10
bind -n S-Down resize-pane -D 5

# Window switching - Alt+number (no prefix)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g focus-events on
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'


### STYLING ###
# panes - Firefly colors (Blue Ghost blue active, Composite Gray inactive)
set -g pane-border-style 'fg=#3F3F3F'
set -g pane-active-border-style 'fg=#0075DE'

# window list - Firefly colors
set -g window-status-style 'fg=#707070'
set -g window-status-current-style 'fg=#0075DE,bold'

# statusbar
set -g status-position bottom
set -g status-justify left


### PLUGINS ###
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# resurrect config
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# dracula widgets
set -g @plugin 'dracula/tmux'
set -g @dracula-plugins "git network-bandwidth weather"
# git widget config
set -g @dracula-git-show-current-symbol "*"
set -g @dracula-git-show-diff-symbol "+"
set -g @dracula-git-show-remote-status true
set -g @dracula-git-no-untracked-files true
set -g @dracula-git-colors "blue dark_gray"
# network bandwidth widget
set -g @dracula-network-bandwidth-interval 10
set -g @dracula-network-bandwidth-show-interface true
set -g @dracula-network-bandwidth-colors "purple dark_gray"
# weather widget
set -g @dracula-show-fahrenheit true
set -g @dracula-fixed-location "78613"
set -g @dracula-show-location true
set -g @dracula-weather-colors "cyan dark_gray"
# dracula appearance
set -g @dracula-show-powerline true
set -g @dracula-refresh-rate 10


# automatic tpm installation
if "test ! -d ~/.tmux/plugins/tpm" \
    "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
run '~/.tmux/plugins/tpm/tpm'

