# fix envvar inheritance for Wayland/X11
set -g update-environment "DISPLAY XAUTHORITY WAYLAND_DISPLAY"

# prefix rebind
unbind C-Space
set -g prefix C-space
bind C-Space send-prefix

# enable mouse control
set -g mouse on
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "xclip -in -selection clipboard"
setw -g mode-keys vi

# reload config file
bind r display -d 2000 "Reloading config..." \; source-file ~/.tmux.conf \; display -d 1500 "Config reloaded!"

# history limit
set-option -g history-limit 5000

# session
bind Escape detach-client
unbind d

# windows
bind Space new-window -c "#{pane_current_path}"

# panes
bind | split-window -h -c "#{pane_current_path}"
bind '\' split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
# grab a pane from another window into this one
bind g choose-window 'join-pane -h -s "%%"'
bind G choose-window 'join-pane -s "%%"'
bind x kill-pane
bind X kill-window
bind b break-pane
bind S set-option synchronize-panes

# pane repositioning
# daily: swap current pane with its neighbor in a direction (no mark needed)
bind Left  swap-pane -s '{left-of}'          # swap with pane to the left
bind Right swap-pane -s '{right-of}'         # swap with pane to the right
bind Up    swap-pane -s '{up-of}'            # swap with pane above
bind Down  swap-pane -s '{down-of}'          # swap with pane below

# quick reshape: cycle through the 5 preset layouts
bind o next-layout

# restructure/regroup: mark a source pane (Prefix+m), go to target pane,
# then HJKL flings the marked pane into a NEW split beside the target
bind m select-pane -m                        # mark/unmark this pane
bind H join-pane -h -b -s '{marked}'         # marked -> LEFT of current
bind L join-pane -h    -s '{marked}'         # marked -> RIGHT of current
bind K join-pane -v -b -s '{marked}'         # marked -> ABOVE current
bind J join-pane -v    -s '{marked}'         # marked -> BELOW current

# Claude
bind c split-window -v -c "#{pane_current_path}" "claude"

# Pane navigation - Ctrl+arrows (no prefix)
bind -n C-Left select-pane -L
bind -n C-Right select-pane -R
bind -n C-Up select-pane -U
bind -n C-Down select-pane -D

# Pane resizing - Shift+arrows (no prefix):
bind -n S-Left resize-pane -L 1
bind -n S-Right resize-pane -R 2
bind -n S-Up resize-pane -U 1
bind -n S-Down resize-pane -D 2

# Window switching - Alt+number row
bind -n M-0 select-window -t 0
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Window switching - Alt+numpad
bind -n M-KP0 select-window -t 0
bind -n M-KP1 select-window -t 1
bind -n M-KP2 select-window -t 2
bind -n M-KP3 select-window -t 3
bind -n M-KP4 select-window -t 4
bind -n M-KP5 select-window -t 5
bind -n M-KP6 select-window -t 6
bind -n M-KP7 select-window -t 7
bind -n M-KP8 select-window -t 8
bind -n M-KP9 select-window -t 9
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g focus-events on
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'


###   STYLING   ###
# panes - Firefly colors (Land Blue active, Composite Gray inactive)
set -g pane-border-style 'fg=#3F3F3F'
set -g pane-active-border-style 'fg=#0075DE'

# window list - Firefly colors
set -g window-status-style 'fg=#707070'
set -g window-status-current-style 'fg=#0075DE,bold'

# statusbar - two lines via tmux-powerline (VISIBILITY=2 in its config.sh):
# top line = left/right segments, second line = window list
set -g status-position bottom


###   PLUGINS   ###
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# resurrect/continuum config
set -g @resurrect-capture-pane-contents 'on'
# geometry file lives in resurrect's XDG data dir (~/.local/share/tmux/resurrect),
# not the legacy ~/.tmux/resurrect which newer resurrect no longer uses
set -g @resurrect-hook-post-save-all 'eval $(xdotool getwindowgeometry --shell $WINDOWID); echo 0,$X,$Y,$WIDTH,$HEIGHT > $HOME/.local/share/tmux/resurrect/geometry'
set -g @resurrect-hook-pre-restore-all 'wmctrl -i -r $WINDOWID -e $(cat $HOME/.local/share/tmux/resurrect/geometry)'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'
set -g @continuum-boot 'on'
# also restore claude (not in resurrect's default whitelist).
# '~claude' matches any pane running claude and restores the SAVED command
# verbatim (no '->' override). The custom save strategy below records
# `claude -r <sessionId>` for claude panes, so restore reopens the exact
# conversation. Non-claude panes are unaffected (strategy delegates to `ps`).
set -g @resurrect-processes '~claude'
set -g @resurrect-save-command-strategy 'claude'
# The strategy 'claude' resolves to save_command_strategies/claude.sh inside the
# plugin. It's a symlink to the real script in ~/setup-files/tmux; recreate it on
# config load so a tpm plugin update can't silently leave it missing.
#if "test ! -L ~/.tmux/plugins/tmux-resurrect/save_command_strategies/claude.sh" \
#    "run 'ln -sf ~/setup-files/tmux/resurrect-claude-save.sh ~/.tmux/plugins/tmux-resurrect/save_command_strategies/claude.sh'"

# tmux-powerline config
# Point to config in home dir (symlinked by bashrc from setup-files)
set-environment -g TMUX_POWERLINE_CONFIG_FILE "$HOME/.tmux-powerline/config.sh"
set -g @plugin 'erikw/tmux-powerline'
set -g status-interval 2

# tmux-continuum must be the LAST plugin loaded. any plugin that 
# overwrites status-right kills the autosave.
set -g @plugin 'tmux-plugins/tmux-continuum'


# automatic tpm installation
if "test ! -d ~/.tmux/plugins/tpm" \
    "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

run '~/.tmux/plugins/tpm/tpm'

